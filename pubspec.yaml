name: tabibak_users
description: طبيبك - تطبيق حجز الأطباء والأسرّة والخدمات المنزلية والإسعاف
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'   # الكود يستخدم Records (Dart 3)

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1     # خط Cairo (يُحمَّل من الإنترنت أول تشغيل)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # الفولدر لازم يكون موجوداً في المشروع (حتى لو فاضي) وإلا يفشل البناء
  assets:
    - assets/images/       # doctor1-4.jpg · hospital1-3.jpg · stethoscope.png
