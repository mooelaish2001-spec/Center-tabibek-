Scripting build steps and artifact locations for both formats


Scripting build steps and artifact locations for both formats
Android apps don’t build to a .bin file; the installable files are .apk and .aab. So this workflow builds both, and also saves a copy of the APK named Tabebik-5-center.bin. I took “Tabebik-5” as your repo and “center” as the center app.

Save it as codemagic.yaml in the repo root. It finds pubspec.yaml by itself, whether it sits in the root or in a center_app/ folder:



yaml
workflows:
  tabebik-5-center:
    name: Tabebik-5 Center
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Locate the center app
        script: |
          if [ -f pubspec.yaml ]; then APP=.;
          elif [ -f center_app/pubspec.yaml ]; then APP=center_app;
          else echo "pubspec.yaml not found. Repo contents:"; ls -R | head -50; exit 1; fi
          echo "APP_DIR=$APP" >> $CM_ENV

      - name: Generate the missing android/ folder
        script: |
          cd "$APP_DIR"
          test -f lib/main.dart || { echo "lib/main.dart not found"; exit 1; }
          cp lib/main.dart /tmp/main.dart.bak
          flutter create --platforms=android --org com.tabebik --project-name tabibak_center .
          cp /tmp/main.dart.bak lib/main.dart
          rm -f test/widget_test.dart

      - name: App name and internet permission
        script: |
          cd "$APP_DIR"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Tabebik Center"/' "$MANIFEST"
          grep -q "android.permission.INTERNET" "$MANIFEST" || \
            perl -0pi -e 's/(<manifest[^>]*>)/$1\n    <uses-permission android:name="android.permission.INTERNET"\/>/' "$MANIFEST"

      - name: Get packages and analyze
        script: |
          cd "$APP_DIR"
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK and AAB
        script: |
          cd "$APP_DIR"
          flutter build apk --release --no-tree-shake-icons --build-number=$BUILD_NUMBER
          flutter build appbundle --release --no-tree-shake-icons --build-number=$BUILD_NUMBER

      - name: Collect the output files
        script: |
          mkdir -p "$CM_BUILD_DIR/artifacts"
          cd "$APP_DIR"
          cp build/app/outputs/flutter-apk/app-release.apk "$CM_BUILD_DIR/artifacts/Tabebik-5-center.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$CM_BUILD_DIR/artifacts/Tabebik-5-center.bin"
          cp build/app/outputs/bundle/release/app-release.aab "$CM_BUILD_DIR/artifacts/Tabebik-5-center.aab"

    artifacts:
      - artifacts/*
